<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vxness Chart</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0e0f13; overflow: hidden; }
  #tv_chart { position: absolute; inset: 0; }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #6b7280; font: 14px -apple-system, "Segoe UI", sans-serif; background: #0e0f13;
  }
</style>
</head>
<body>
  <div id="tv_chart"></div>
  <div id="loading">Loading chart…</div>

  <!-- Qt WebChannel bridge (copied next to this file at build time) -->
  <script src="qwebchannel.js"></script>
  <!-- TradingView Advanced Charts -->
  <script src="vendor/charting_library/charting_library.standalone.js"></script>
  <!-- Vxness datafeed + broker adapter + app -->
  <script src="tx_datafeed.js"></script>
  <script src="tx_positions.js"></script>
  <!-- tx_broker.js (native Broker API adapter) is intentionally NOT loaded:
       this charting_library is the Advanced Charts build, where the Broker API
       is disabled. It is kept for a future Trading Platform build. -->
  <script src="app.js"></script>
</body>
</html>
